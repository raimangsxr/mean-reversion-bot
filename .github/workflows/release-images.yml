name: Release Images

on:
  release:
    types: [created]

permissions:
  contents: read
  packages: read

env:
  APP_NAME: mean-reversion-bot
  BACKEND_IMAGE: mean-reversion-bot

jobs:
  build-and-push:
    name: Build and push release images
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build and push backend image
        uses: docker/build-push-action@v6
        with:
          context: backend
          push: true
          tags: |
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:${{ github.event.release.tag_name }}
            ${{ secrets.DOCKERHUB_USERNAME }}/${{ env.BACKEND_IMAGE }}:latest
          build-args: |
            PYTHON_VERSION=3.14-slim
          cache-from: type=gha,scope=backend
          cache-to: type=gha,mode=max,scope=backend

      - name: Publish release tag artifact
        run: |
          mkdir -p release-info
          echo "${{ github.event.release.tag_name }}" > release-info/tag.txt
      - name: Upload release tag artifact
        uses: actions/upload-artifact@v4
        with:
          name: release-tag
          path: release-info/tag.txt
