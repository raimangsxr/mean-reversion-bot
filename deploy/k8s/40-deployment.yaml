apiVersion: apps/v1
kind: Deployment
metadata:
  name: mean-reversion-bot
  namespace: mean-reversion-bot
  labels:
    app.kubernetes.io/name: mean-reversion-bot
    app.kubernetes.io/part-of: v12-forward
spec:
  replicas: 1
  revisionHistoryLimit: 2
  # Never allow an old and a new trading bot Pod to overlap during rollouts.
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: mean-reversion-bot
  template:
    metadata:
      labels:
        app.kubernetes.io/name: mean-reversion-bot
        app.kubernetes.io/part-of: v12-forward
    spec:
      automountServiceAccountToken: false
      enableServiceLinks: false
      terminationGracePeriodSeconds: 30
      securityContext:
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: bot
          # Replace with an immutable image tag before deployment.
          image: docker.io/replace-me/mean-reversion-bot:v12-orderflow
          imagePullPolicy: IfNotPresent
          envFrom:
            - configMapRef:
                name: mean-reversion-bot-config
            - secretRef:
                name: mean-reversion-bot-secrets
          env:
            - name: PYTHONUNBUFFERED
              value: "1"
            - name: PYTHONDONTWRITEBYTECODE
              value: "1"
            - name: HOME
              value: /tmp
            - name: XDG_CACHE_HOME
              value: /tmp/.cache
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: "1"
              memory: 1Gi
          securityContext:
            runAsNonRoot: true
            runAsUser: 10001
            runAsGroup: 10001
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop:
                - ALL
          # main.py catches SIGINT and closes the order-flow collector in its
          # finally block. This makes normal Kubernetes termination graceful.
          lifecycle:
            preStop:
              exec:
                command:
                  - /bin/sh
                  - -c
                  - kill -INT 1 || true; sleep 5
          volumeMounts:
            - name: state
              mountPath: /app/state
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: state
          persistentVolumeClaim:
            claimName: mean-reversion-bot-state
        - name: tmp
          emptyDir: {}
